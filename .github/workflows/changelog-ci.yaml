name: Changelog CI

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version or label for the changelog
        required: true
        type: string
  pull_request:
    types: [ opened ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Changelog CI
        uses: saadmk11/changelog-ci@5b5ee0d3959eb63923c59d42ccd4afac1321b034  # v2.0.3
        with:
          release_version: ${{ inputs.release_version }}
          verbose: 'true'
          summary: 'true'
