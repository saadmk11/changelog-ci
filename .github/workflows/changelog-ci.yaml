name: Changelog CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          python-version: '3.15'

      - name: Run Changelog CI
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --extra actions changelog-ci actions --output-mode github
