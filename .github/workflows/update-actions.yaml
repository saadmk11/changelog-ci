name: Update GitHub Actions

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: update-github-actions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.WORKFLOW_SECRET }}
      - name: Update action pins
        uses: saadmk11/github-actions-version-updater@6f0526e530aad279895d63087f14110de732d878  # v1.0.2
        with:
          token: ${{ secrets.WORKFLOW_SECRET }}
          update_version_with: release-commit-sha
          extra_workflow_locations: action.yaml
          pull_request_branch: update-github-actions
