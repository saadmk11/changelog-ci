name: Publish

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/test.yaml
  compatibility:
    uses: ./.github/workflows/action-test.yaml

  build:
    needs: [tests, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: 0.13.1
          python-version: '3.15'
      - name: Validate immutable release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --locked --group dev python -m tests.packaging.release "$RELEASE_TAG"
      - name: Build and install both distributions
        run: uv run --locked --group dev tox run -e package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: 0.13.1
      - uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: dist/*
      - run: uv publish --trusted-publishing always dist/*

  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: 0.13.1
      - name: Verify exact PyPI installation and action entry point
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for attempt in 1 2 3 4 5; do
            if uv --no-config tool run --isolated --no-cache --python 3.15 \
              --default-index https://pypi.org/simple --from "gh-changelog-ci[actions]==$version" \
              gh-changelog-ci actions --help; then
              exit 0
            fi
            sleep 15
          done
          exit 1
