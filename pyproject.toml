[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "gh-changelog-ci"
version = "2.0.3"
description = "Generate changelogs from GitHub pull requests or commits."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Maksudul Haque"}]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.27.3,<0.28",
  "pydantic>=2.14.1,<3",
  "httpx>=0.28.1,<0.29",
  "certifi>=2026.10.19",
  "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
actions = ["github-action-utils>=2.0.0,<3"]

[project.scripts]
gh-changelog-ci = "gh_changelog_ci.cli:app"

[project.urls]
Homepage = "https://github.com/saadmk11/changelog-ci"
Issues = "https://github.com/saadmk11/changelog-ci/issues"
Documentation = "https://github.com/saadmk11/changelog-ci#readme"

[dependency-groups]
test = ["pytest>=9.1.1", "pytest-cov>=7"]
lint = ["ruff>=0.14"]
typing = ["mypy>=1.18", "types-PyYAML>=6"]
build = ["twine>=6", "uv==0.13.1"]
dev = [
  {include-group = "test"},
  {include-group = "lint"},
  {include-group = "typing"},
  {include-group = "build"},
  "tox>=4.66",
  "tox-uv>=1.37",
]

[tool.uv]
default-groups = []

[tool.uv.build-backend]
source-include = ["tests/**", "action.yaml", ".python-version", "uv.lock"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
filterwarnings = ["error"]
markers = ["actions: requires the optional actions integration"]

[tool.coverage.run]
source = ["gh_changelog_ci"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.tox]
requires = ["tox>=4.66", "tox-uv>=1.37"]
env_list = [
  "py311", "py312", "py313", "py314", "py315",
  "py311-actions", "py312-actions", "py313-actions", "py314-actions", "py315-actions",
  "lint", "type", "package", "minimum", "latest",
]
skip_missing_interpreters = false

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
package = "wheel"
no_default_groups = true
uv_sync_locked = true
uv_python_preference = "managed"
pass_env = ["UV_CACHE_DIR", "UV_PYTHON_INSTALL_DIR"]
dependency_groups = ["test"]
commands = [["python", "-m", "pytest", "{posargs:tests/unit}"]]

[tool.tox.env.py311-actions]
base_python = ["python3.11"]
extras = ["actions"]
commands = [["python", "-m", "pytest", "{posargs:tests}"]]

[tool.tox.env.py312-actions]
base_python = ["python3.12"]
extras = ["actions"]
commands = [["python", "-m", "pytest", "{posargs:tests}"]]

[tool.tox.env.py313-actions]
base_python = ["python3.13"]
extras = ["actions"]
commands = [["python", "-m", "pytest", "{posargs:tests}"]]

[tool.tox.env.py314-actions]
base_python = ["python3.14"]
extras = ["actions"]
commands = [["python", "-m", "pytest", "{posargs:tests}"]]

[tool.tox.env.py315-actions]
base_python = ["python3.15"]
extras = ["actions"]
commands = [["python", "-m", "pytest", "{posargs:tests}"]]

[tool.tox.env.lint]
dependency_groups = ["lint"]
commands = [
  ["ruff", "check", "src", "tests"],
  ["ruff", "format", "--check", "src", "tests"],
]
[tool.tox.env.type]
dependency_groups = ["typing", "test"]
commands = [["python", "-m", "mypy"]]

[tool.tox.env.package]
dependency_groups = ["build"]
commands = [
  ["uv", "build", "--no-sources"],
  ["python", "-m", "tests.packaging.check"],
]
[tool.tox.env.minimum]
runner = "uv-venv-runner"
uv_resolution = "lowest-direct"
recreate = true
extras = ["actions"]
commands = [["python", "-m", "pytest", "{posargs:tests}"]]

[tool.tox.env.latest]
runner = "uv-venv-runner"
uv_resolution = "highest"
recreate = true
extras = ["actions"]
commands = [["python", "-m", "pytest", "{posargs:tests}"]]
